<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" width="1180" height="480"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>

    <!-- Filters -->
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="legacyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="reconcileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1180" height="480" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================================================================== -->
  <!-- LEFT COLUMN: CONTROL PLANES & METADATA DATABASES                     -->
  <!-- ==================================================================== -->

  <!-- TOP-LEFT: LEGACY CONTROL PLANE -->
  <g transform="translate(25, 20)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="190" rx="10" fill="#fff9f9" stroke="#fca5a5" stroke-width="1.4" stroke-dasharray="6 4"/>

    <!-- Section Badge -->
    <rect x="18" y="12" width="160" height="24" rx="5" fill="url(#legacyGrad)" stroke="#f87171" stroke-width="1"/>
    <text x="98" y="28" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="0.5">LEGACY CONTROL PLANE</text>

    <!-- Pricing UI Component -->
    <g transform="translate(135, 52)">
      <!-- UI Box -->
      <rect x="0" y="0" width="135" height="40" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.3"/>
      <text x="67.5" y="16" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Pricing's own</text>
      <text x="67.5" y="31" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Experiment UI</text>

      <!-- Connecting Arrow -->
      <line x1="67.5" y1="40" x2="67.5" y2="52" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrGray)"/>

      <!-- Backend Box -->
      <rect x="0" y="52" width="135" height="46" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <text x="67.5" y="71" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Pricing UI</text>
      <text x="67.5" y="87" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Backend</text>
    </g>

    <!-- Arrow Backend -> Pricing DB -->
    <path d="M 270 125 L 305 125" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrRed)"/>

    <!-- Pricing DB Cylinder -->
    <g transform="translate(305, 54)">
      <path d="M 0 12 C 0 5 30 0 67.5 0 C 105 0 135 5 135 12 L 135 78 C 135 85 105 90 67.5 90 C 30 90 0 85 0 78 Z" fill="#ddedff" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M 135 12 C 135 19 105 24 67.5 24 C 30 24 0 19 0 12" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="67.5" y="58" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Pricing DB</text>
    </g>

    <!-- Data feed to Pricing Backend Service -->
    <path d="M 440 102 L 480 102" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  </g>

  <!-- DATABASE RECONCILIATION BRIDGE (BETWEEN THE TWO DBS) -->
  <g transform="translate(397.5, 212)">
    <line x1="0" y1="-2" x2="0" y2="12" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="3 3"/>

    <!-- State Sync Badge -->
    <rect x="-77.5" y="12" width="155" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="0" y="30" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">State Backfill &amp; Sync</text>

    <line x1="0" y1="40" x2="0" y2="56" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrBlue)"/>
  </g>

  <!-- BOTTOM-LEFT: TARGET EXPERIMENT PLATFORM -->
  <g transform="translate(25, 270)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="455" height="190" rx="10" fill="#f6fef9" stroke="#86efac" stroke-width="1.4"/>

    <!-- Section Badge -->
    <rect x="18" y="12" width="185" height="24" rx="5" fill="url(#targetGrad)" stroke="#4ade80" stroke-width="1"/>
    <text x="110" y="28" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle" letter-spacing="0.5">TARGET EXPERIMENT PLATFORM</text>

    <!-- Token Pool Cylinder -->
    <g transform="translate(18, 54)">
      <path d="M 0 10 C 0 4 20 0 47.5 0 C 75 0 95 4 95 10 L 95 78 C 95 84 75 88 47.5 88 C 20 88 0 84 0 78 Z" fill="#fffcdd" stroke="#ca8a04" stroke-width="1.4"/>
      <path d="M 95 10 C 95 16 75 20 47.5 20 C 20 20 0 16 0 10" fill="none" stroke="#ca8a04" stroke-width="1.4"/>
      <text x="47.5" y="55" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Token Pool</text>
    </g>

    <!-- Arrow Token Pool -> Experiment Platform UI -->
    <path d="M 113 102 L 135 102" fill="none" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#arrGray)"/>

    <!-- Experiment Platform UI & Backend -->
    <g transform="translate(135, 52)">
      <!-- UI Box -->
      <rect x="0" y="0" width="135" height="40" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.3"/>
      <text x="67.5" y="16" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Experiment Platform</text>
      <text x="67.5" y="31" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">UI</text>

      <!-- Connecting Arrow -->
      <line x1="67.5" y1="40" x2="67.5" y2="52" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrGray)"/>

      <!-- Backend Box -->
      <rect x="0" y="52" width="135" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="67.5" y="71" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Experiment Platform</text>
      <text x="67.5" y="87" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Backend</text>
    </g>

    <!-- Arrow Backend -> Experiment Platform DB -->
    <path d="M 270 125 L 305 125" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreen)"/>

    <!-- Experiment Platform DB Cylinder -->
    <g transform="translate(305, 54)">
      <path d="M 0 12 C 0 5 30 0 67.5 0 C 105 0 135 5 135 12 L 135 78 C 135 85 105 90 67.5 90 C 30 90 0 85 0 78 Z" fill="#ddedff" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M 135 12 C 135 19 105 24 67.5 24 C 30 24 0 19 0 12" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="67.5" y="51" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Experiment Platform</text>
      <text x="67.5" y="67" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">DB</text>
    </g>

    <!-- Data feed to Pricing Backend Service -->
    <path d="M 440 102 L 480 102" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  </g>

  <!-- ==================================================================== -->
  <!-- RIGHT SIDE: PRICING BACKEND SERVICE (TRANSITIONAL RUNTIME)           -->
  <!-- ==================================================================== -->
  <g transform="translate(505, 20)" filter="url(#cardShadow)">
    <!-- Outer Service Container -->
    <rect x="0" y="0" width="650" height="440" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>

    <!-- Service Header Banner -->
    <rect x="0" y="0" width="650" height="42" rx="10" fill="#fee2e2"/>
    <rect x="0" y="26" width="650" height="16" fill="#fee2e2"/>
    <text x="22" y="28" font-size="13" font-weight="700" fill="#991b1b">Pricing backend service</text>

    <!-- Sub-badge on Banner -->
    <rect x="475" y="10" width="160" height="22" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
    <text x="555" y="25" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="0.5">DUAL ALLOCATION</text>

    <!-- COMPONENT 1: LIVE SEARCH REQUEST -->
    <g transform="translate(18, 190)">
      <rect x="0" y="0" width="76" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="38" y="24" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Search</text>
      <text x="38" y="39" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Request</text>
    </g>

    <!-- Arrow Request -> Allocation Interface -->
    <path d="M 94 216 L 112 216" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrGray)"/>

    <!-- COMPONENT 2: ALLOCATION INTERFACE -->
    <g transform="translate(112, 185)">
      <rect x="0" y="0" width="118" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
      <text x="59" y="29" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Allocation</text>
      <text x="59" y="46" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Interface</text>
    </g>

    <!-- Branch Arrow 1: Facade -> Legacy Allocator (Upward branch) -->
    <path d="M 230 202 L 246 202 L 246 102 L 262 102" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrRed)"/>

    <!-- Branch Arrow 2: Facade -> Platform Client SDK (Downward branch) -->
    <path d="M 230 230 L 246 230 L 246 352 L 262 352" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrGreen)"/>

    <!-- COMPONENT 3A: LEGACY ALLOCATOR (TOP PATH) -->
    <g transform="translate(262, 74)">
      <rect x="0" y="0" width="136" height="56" rx="7" fill="#fff1f2" stroke="#f87171" stroke-width="1.4"/>
      <text x="68" y="33" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Legacy Allocator</text>
    </g>

    <!-- COMPONENT 3B: PLATFORM CLIENT SDK (BOTTOM PATH) -->
    <g transform="translate(262, 324)">
      <rect x="0" y="0" width="136" height="56" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
      <text x="68" y="33" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Platform Client SDK</text>
    </g>

    <!-- CONVERGENCE & AUDIT PATHS -->

    <!-- Arrow Legacy -> Dynamic Router -->
    <path d="M 398 94 L 425 94" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>

    <!-- Arrow Legacy -> Shadow Reconciliation (Crossing down) -->
    <path d="M 398 110 L 407 110 L 407 342 L 425 342" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrRed)"/>

    <!-- Arrow Platform SDK -> Dynamic Router (Crossing up) -->
    <path d="M 398 344 L 415 344 L 415 110 L 425 110" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrGreen)"/>

    <!-- Arrow Platform SDK -> Shadow Reconciliation -->
    <path d="M 398 360 L 425 360" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>

    <!-- COMPONENT 4A: DYNAMIC ROUTER -->
    <g transform="translate(425, 74)">
      <rect x="0" y="0" width="118" height="56" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.4"/>
      <text x="59" y="33" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Dynamic Router</text>
    </g>

    <!-- COMPONENT 4B: SHADOW RECONCILIATION -->
    <g transform="translate(425, 324)">
      <rect x="0" y="0" width="118" height="56" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
      <text x="59" y="26" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Shadow</text>
      <text x="59" y="41" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Reconciliation</text>
    </g>

    <!-- Arrow Dynamic Router -> Variant Output -->
    <path d="M 543 102 L 560 102" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrBlue)"/>

    <!-- OUTPUT 1: SERVED VARIANT -->
    <g transform="translate(560, 78)">
      <rect x="0" y="0" width="76" height="48" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/>
      <text x="38" y="22" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Variant</text>
      <text x="38" y="36" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">A / B</text>
    </g>

    <!-- Arrow Shadow Reconciliation -> Parity Telemetry -->
    <path d="M 543 352 L 560 352" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrPurple)"/>

    <!-- OUTPUT 2: PARITY TELEMETRY -->
    <g transform="translate(560, 328)">
      <rect x="0" y="0" width="76" height="48" rx="6" fill="url(#reconcileGrad)" stroke="#8b5cf6" stroke-width="1.4"/>
      <text x="38" y="22" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">Parity</text>
      <text x="38" y="36" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle">Telemetry</text>
    </g>
  </g>
</svg>