<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>

    <!-- Filters -->
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="shadowCard" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#f8fafc" rx="12"/>

  <!-- Top Header Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="24" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Strangler Fig Migration: Live Experimentation Engine</text>
    <text x="0" y="46" font-size="13" font-weight="500" fill="#64748b">Zero-downtime transition from bespoke in-app allocation and legacy databases to a centralized enterprise platform</text>
  </g>

  <!-- Legend (Top Right) -->
  <g transform="translate(790, 24)">
    <!-- MSSQL Table Legend -->
    <rect x="0" y="10" width="16" height="16" rx="3" fill="#ddedff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="24" y="23" font-size="11" font-weight="600" fill="#334155">MSSQL Table</text>

    <!-- Hive Table Legend -->
    <rect x="115" y="10" width="16" height="16" rx="3" fill="#fffcdd" stroke="#eab308" stroke-width="1.2"/>
    <text x="139" y="23" font-size="11" font-weight="600" fill="#334155">Hive Table</text>

    <!-- Shadow Diff Legend -->
    <rect x="210" y="10" width="16" height="16" rx="3" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="234" y="23" font-size="11" font-weight="600" fill="#581c87">Shadow Parity</text>

    <!-- Legacy / Target Indicator -->
    <circle cx="330" cy="18" r="5" fill="#ef4444"/>
    <text x="340" y="22" font-size="11" font-weight="600" fill="#991b1b">Legacy</text>
    <circle cx="390" cy="18" r="5" fill="#10b981"/>
    <text x="400" y="22" font-size="11" font-weight="600" fill="#065f46">Target</text>
  </g>

  <!-- Incoming Traffic and Strangler Facade Zone (Left) -->
  <g transform="translate(40, 95)">
    <!-- Request Input Badge -->
    <rect x="0" y="210" width="110" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="55" y="228" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Live Request</text>
    <text x="55" y="243" font-size="10" fill="#60a5fa" text-anchor="middle">Search / Pricing</text>

    <!-- Arrow to Strangler Facade -->
    <path d="M 110 231 L 148 231" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrBlue)"/>

    <!-- Strangler Facade Card -->
    <g filter="url(#shadowCard)">
      <rect x="150" y="30" width="125" height="470" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="150" y="30" width="125" height="40" rx="10" fill="#ede9fe"/>
      <rect x="150" y="60" width="125" height="10" fill="#ede9fe"/>
      <text x="212" y="55" font-size="13" font-weight="800" fill="#6b21a8" text-anchor="middle">Strangler</text>
      <text x="212" y="85" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">Adapter Facade</text>

      <!-- Routing Dial -->
      <rect x="162" y="150" width="101" height="64" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.2"/>
      <text x="212" y="170" font-size="11" font-weight="700" fill="#9d174d" text-anchor="middle">Traffic Router</text>
      <text x="212" y="188" font-size="10" font-weight="600" fill="#be185d" text-anchor="middle">0% to 100%</text>
      <text x="212" y="202" font-size="9" fill="#db2777" text-anchor="middle">Dynamic Config</text>

      <!-- Shadow Dual-Dispatch -->
      <rect x="162" y="250" width="101" height="85" rx="6" fill="#f5f3ff" stroke="#a855f7" stroke-width="1.2"/>
      <text x="212" y="272" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Dual-Dispatch</text>
      <text x="212" y="292" font-size="10" fill="#7c3aed" text-anchor="middle">Primary Path</text>
      <text x="212" y="308" font-size="10" fill="#9333ea" text-anchor="middle">+ Silent Shadow</text>
      <text x="212" y="324" font-size="9" fill="#a855f7" text-anchor="middle">(No Side Effects)</text>
    </g>
  </g>

  <!-- UPPER FLOW: LEGACY EXPERIMENTATION (DEPRECATING) -->
  <g transform="translate(340, 95)" filter="url(#shadowCard)">
    <!-- Container -->
    <rect x="0" y="0" width="820" height="235" rx="12" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.8" stroke-dasharray="6 4"/>

    <!-- Header Badge -->
    <rect x="20" y="14" width="220" height="26" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="34" cy="27" r="4" fill="#dc2626"/>
    <text x="46" y="31" font-size="11" font-weight="800" fill="#991b1b" letter-spacing="0.5">LEGACY FLOW (DEPRECATING)</text>

    <!-- Component 1: Offline Candidate Pool (Hive) -->
    <g transform="translate(30, 56)">
      <!-- Cylinder shape for Hive Table -->
      <path d="M 0 12 C 0 5 35 0 80 0 C 125 0 160 5 160 12 L 160 84 C 160 91 125 96 80 96 C 35 96 0 91 0 84 Z" fill="#fffcdd" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M 160 12 C 160 19 125 24 80 24 C 35 24 0 19 0 12" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="80" y="44" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Offline Salt Pool</text>
      <text x="80" y="60" font-size="10" font-weight="600" fill="#a16207" text-anchor="middle">(Hive Table)</text>
      <text x="80" y="78" font-size="9" fill="#713f12" text-anchor="middle">Bespoke Spark Jobs</text>
    </g>

    <!-- Arrow from Hive to Admin Portal -->
    <path d="M 190 104 L 235 104" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- Component 2: Legacy Admin and DB (MSSQL) -->
    <g transform="translate(240, 56)">
      <rect x="0" y="0" width="165" height="42" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
      <text x="82" y="19" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Legacy Admin Portal</text>
      <text x="82" y="33" font-size="9" fill="#dc2626" text-anchor="middle">Manual Run Setup</text>

      <line x1="82" y1="42" x2="82" y2="52" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrGray)"/>

      <!-- Cylinder shape for MSSQL Table -->
      <path d="M 5 62 C 5 57 38 53 82 53 C 126 53 160 57 160 62 L 160 102 C 160 107 126 111 82 111 C 38 111 5 107 5 102 Z" fill="#ddedff" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M 160 62 C 160 67 126 71 82 71 C 38 71 5 67 5 62" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="82" y="85" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Legacy Run DB</text>
      <text x="82" y="99" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">(MSSQL Table)</text>
    </g>

    <!-- Arrow to Legacy In-App Allocator -->
    <path d="M 405 104 L 445 104" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- Component 3: Legacy In-App Allocator -->
    <g transform="translate(450, 60)">
      <rect x="0" y="0" width="190" height="90" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="26" rx="8" fill="#fee2e2"/>
      <rect x="0" y="16" width="190" height="10" fill="#fee2e2"/>
      <text x="95" y="18" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Legacy In-App Allocator</text>
      <text x="95" y="44" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Bespoke Token Hashing</text>
      <text x="95" y="60" font-size="10" fill="#7f1d1d" text-anchor="middle">MD5(Entity + Salt) % 100</text>
      <text x="95" y="76" font-size="9" fill="#991b1b" text-anchor="middle">CSV Cluster Files via Consul</text>
    </g>

    <!-- Arrow to Legacy Variant Output -->
    <path d="M 640 105 L 685 105" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/>

    <!-- Legacy Variant Box -->
    <g transform="translate(690, 84)">
      <rect x="0" y="0" width="110" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="55" y="19" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Legacy Variant</text>
      <text x="55" y="34" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Variant A / B</text>
    </g>
  </g>

  <!-- LOWER FLOW: TARGET CENTRAL PLATFORM (MODERN) -->
  <g transform="translate(340, 400)" filter="url(#shadowCard)">
    <!-- Container -->
    <rect x="0" y="0" width="820" height="240" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>

    <!-- Header Badge -->
    <rect x="20" y="14" width="260" height="26" rx="5" fill="#dcfce7" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="34" cy="27" r="4" fill="#059669"/>
    <text x="46" y="31" font-size="11" font-weight="800" fill="#065f46" letter-spacing="0.5">TARGET CENTRAL PLATFORM (MODERN)</text>

    <!-- Component 1: Central Salt Pool (Hive) -->
    <g transform="translate(30, 58)">
      <path d="M 0 12 C 0 5 35 0 80 0 C 125 0 160 5 160 12 L 160 84 C 160 91 125 96 80 96 C 35 96 0 91 0 84 Z" fill="#fffcdd" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M 160 12 C 160 19 125 24 80 24 C 35 24 0 19 0 12" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="80" y="44" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">Pairwise Salt Pool</text>
      <text x="80" y="60" font-size="10" font-weight="600" fill="#a16207" text-anchor="middle">(Hive Table)</text>
      <text x="80" y="78" font-size="9" fill="#713f12" text-anchor="middle">Platform Spark Pipelines</text>
    </g>

    <!-- Arrow to Central Services -->
    <path d="M 190 106 L 235 106" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- Component 2: Central Portal and DB (MSSQL) -->
    <g transform="translate(240, 58)">
      <rect x="0" y="0" width="165" height="38" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
      <text x="82" y="17" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Central Exp Portal</text>
      <text x="82" y="30" font-size="9" fill="#059669" text-anchor="middle">Enterprise Governance</text>

      <line x1="82" y1="38" x2="82" y2="48" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrGray)"/>

      <!-- Cylinder shape for MSSQL Table -->
      <path d="M 5 58 C 5 53 38 49 82 49 C 126 49 160 53 160 58 L 160 98 C 160 103 126 107 82 107 C 38 107 5 103 5 98 Z" fill="#ddedff" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M 160 58 C 160 63 126 67 82 67 C 38 67 5 63 5 58" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="82" y="80" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Central Exp DB</text>
      <text x="82" y="94" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">(MSSQL Tables)</text>

      <line x1="82" y1="107" x2="82" y2="117" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrGray)"/>

      <!-- Experiment Service REST API -->
      <rect x="0" y="117" width="165" height="34" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
      <text x="82" y="132" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Experiment Service API</text>
      <text x="82" y="145" font-size="8.5" fill="#64748b" text-anchor="middle">Metadata and Cluster Maps</text>
    </g>

    <!-- Arrow to Central Client Library -->
    <path d="M 405 134 L 445 134" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- Component 3: Central Client SDK -->
    <g transform="translate(450, 72)">
      <rect x="0" y="0" width="190" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="26" rx="8" fill="#dcfce7"/>
      <rect x="0" y="16" width="190" height="10" fill="#dcfce7"/>
      <text x="95" y="18" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">Central Client SDK</text>
      <text x="95" y="44" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Standard Allocator Library</text>
      <text x="95" y="60" font-size="10" fill="#065f46" text-anchor="middle">MurmurHash3 (Uniform)</text>
      <text x="95" y="74" font-size="9" fill="#047857" text-anchor="middle">In-Memory Snapshots</text>
      <text x="95" y="88" font-size="8.5" fill="#6b7280" text-anchor="middle">Decoupled Cluster Loading</text>
    </g>

    <!-- Arrow to Target Variant Output -->
    <path d="M 640 120 L 685 120" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>

    <!-- Target Variant Box -->
    <g transform="translate(690, 99)">
      <rect x="0" y="0" width="110" height="42" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
      <text x="55" y="19" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">Target Variant</text>
      <text x="55" y="34" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Variant A / B</text>
    </g>
  </g>

  <!-- MIGRATION SEAM AND CHALLENGES (CENTER BRIDGE) -->
  <!-- 1. Live Relational DB Sync and Migration Bridge -->
  <g transform="translate(615, 268)">
    <path d="M 0 0 L 0 185" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="0" cy="0" r="4" fill="#2563eb"/>
    <circle cx="0" cy="185" r="4" fill="#2563eb"/>

    <g filter="url(#shadowSm)" transform="translate(-70, 72)">
      <rect x="0" y="0" width="140" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="70" y="17" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Live DB Reconciler</text>
      <text x="70" y="31" font-size="8.5" fill="#3b82f6" text-anchor="middle">Runs and Salts Sync</text>
    </g>
  </g>

  <!-- 2. Strangler Routing Lines from Facade to Both Paths -->
  <!-- Route to Legacy Path -->
  <path d="M 315 220 L 370 200" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="315" y="195" font-size="10" font-weight="700" fill="#ef4444">Legacy Path</text>

  <!-- Route to Target Path -->
  <path d="M 315 410 L 370 470" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="310" y="475" font-size="10" font-weight="700" fill="#10b981">Target Path</text>

  <!-- 3. REAL-TIME SHADOW DIFFING AND PARITY VALIDATION (Center-Right) -->
  <g transform="translate(860, 290)" filter="url(#shadowCard)">
    <!-- Container -->
    <rect x="0" y="0" width="220" height="98" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="0" y="0" width="220" height="26" rx="10" fill="#f3e8ff"/>
    <rect x="0" y="16" width="220" height="10" fill="#f3e8ff"/>
    <text x="110" y="18" font-size="11" font-weight="800" fill="#6b21a8" text-anchor="middle">Real-Time Shadow Diffing</text>

    <!-- Parity checklist -->
    <text x="18" y="42" font-size="10" font-weight="700" fill="#7c3aed">[&#10003;] 100% Bucket Parity Match</text>
    <text x="18" y="58" font-size="10" font-weight="600" fill="#475569">[&#10003;] Sub-millisecond Overhead</text>
    <text x="18" y="74" font-size="10" font-weight="600" fill="#475569">[&#10003;] Discrepancy Logging to Kafka</text>
    <text x="18" y="89" font-size="9" fill="#9333ea">Safe cutover without user impact</text>
  </g>

  <!-- Flow Lines from Both Variants into Shadow Diffing -->
  <path d="M 980 221 L 980 286" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
  <path d="M 980 499 L 980 392" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>

  <!-- Final Decision Switch and Response Output (Far Right) -->
  <g transform="translate(1090, 310)">
    <!-- Line to Final Response -->
    <path d="M -8 29 L 28 29" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>

    <g filter="url(#shadowCard)">
      <rect x="30" y="5" width="70" height="48" rx="6" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>
      <text x="65" y="26" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Priced</text>
      <text x="65" y="41" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">Result</text>
    </g>
  </g>
</svg>
