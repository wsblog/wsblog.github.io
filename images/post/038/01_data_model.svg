<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="540" fill="#f8fafc" rx="8"/>

  <!-- Group 1: Campaign Management Domain -->
  <rect x="20" y="20" width="430" height="500" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="430" height="36" rx="10" fill="#e2e8f0"/>
  <rect x="20" y="46" width="430" height="10" fill="#e2e8f0"/>
  <text x="35" y="44" font-size="14" font-weight="700" fill="#1e293b">Campaign Management Domain</text>

  <!-- Group 2: Experimentation Domain -->
  <rect x="490" y="20" width="430" height="500" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="490" y="20" width="430" height="36" rx="10" fill="#e2e8f0"/>
  <rect x="490" y="46" width="430" height="10" fill="#e2e8f0"/>
  <text x="505" y="44" font-size="14" font-weight="700" fill="#1e293b">Experimentation Domain</text>

  <!-- Table: campaign_experiment -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="390" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="70" width="390" height="26" rx="6" fill="#3b82f6"/>
    <rect x="40" y="86" width="390" height="10" fill="#3b82f6"/>
    <text x="52" y="88" font-size="12" font-weight="700" fill="#ffffff">campaign_experiment (Bridge)</text>

    <text x="52" y="112" font-size="11" font-weight="700" fill="#ef4444">PK</text>
    <text x="80" y="112" font-size="11" font-weight="600" fill="#1e293b">id</text>
    <text x="210" y="112" font-size="11" fill="#64748b">BIGINT</text>

    <text x="52" y="132" font-size="11" font-weight="700" fill="#3b82f6">FK</text>
    <text x="80" y="132" font-size="11" font-weight="600" fill="#1d4ed8">experiment_id</text>
    <text x="210" y="132" font-size="11" fill="#64748b">BIGINT (links to experiment)</text>

    <text x="52" y="152" font-size="11" font-weight="700" fill="#3b82f6">FK</text>
    <text x="80" y="152" font-size="11" font-weight="600" fill="#1d4ed8">campaign_ids</text>
    <text x="210" y="152" font-size="11" fill="#64748b">ARRAY / JSON (links to campaign)</text>

    <text x="80" y="172" font-size="11" fill="#334155">name, description, metadata</text>
  </g>

  <!-- Table: campaign -->
  <g filter="url(#shadow)">
    <rect x="40" y="215" width="390" height="175" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="215" width="390" height="26" rx="6" fill="#1d4ed8"/>
    <rect x="40" y="231" width="390" height="10" fill="#1d4ed8"/>
    <text x="52" y="233" font-size="12" font-weight="700" fill="#ffffff">campaign (Pricing Business Rules)</text>

    <text x="52" y="258" font-size="11" font-weight="700" fill="#ef4444">PK</text>
    <text x="80" y="258" font-size="11" font-weight="600" fill="#1e293b">campaign_id</text>
    <text x="210" y="258" font-size="11" fill="#64748b">BIGINT</text>

    <text x="80" y="278" font-size="11" fill="#334155">name, description, type</text>

    <text x="80" y="298" font-size="11" font-weight="600" fill="#0f766e">rules</text>
    <text x="210" y="298" font-size="11" fill="#047857">JSON (Pricing formulas, downlifts, margins)</text>

    <text x="80" y="318" font-size="11" fill="#334155">approval_status, campaign_status</text>
    <text x="80" y="338" font-size="11" fill="#334155">start_date, end_date</text>

    <text x="52" y="362" font-size="11" font-weight="700" fill="#3b82f6">FK</text>
    <text x="80" y="362" font-size="11" font-weight="600" fill="#1d4ed8">segment_ids</text>
    <text x="210" y="362" font-size="11" fill="#64748b">ARRAY (links to segment)</text>
  </g>

  <!-- Table: segment (now in Campaign Domain) -->
  <g filter="url(#shadow)">
    <rect x="40" y="415" width="390" height="92" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="40" y="415" width="390" height="26" rx="6" fill="#6366f1"/>
    <rect x="40" y="431" width="390" height="10" fill="#6366f1"/>
    <text x="52" y="433" font-size="12" font-weight="700" fill="#ffffff">segment (Target Audience Definition)</text>

    <text x="52" y="458" font-size="11" font-weight="700" fill="#ef4444">PK</text>
    <text x="80" y="458" font-size="11" font-weight="600" fill="#1e293b">segment_id</text>
    <text x="210" y="458" font-size="11" fill="#64748b">BIGINT</text>

    <text x="80" y="478" font-size="11" fill="#334155">name, description</text>

    <text x="80" y="496" font-size="11" font-weight="600" fill="#4338ca">rules</text>
    <text x="210" y="496" font-size="11" fill="#4338ca">JSON (device == 'mobile' &amp;&amp; country == 'TH')</text>
  </g>

  <!-- Table: experiment (in Experiment Domain) -->
  <g filter="url(#shadow)">
    <rect x="510" y="70" width="390" height="150" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="510" y="70" width="390" height="26" rx="6" fill="#059669"/>
    <rect x="510" y="86" width="390" height="10" fill="#059669"/>
    <text x="522" y="88" font-size="12" font-weight="700" fill="#ffffff">experiment (A/B Test Configuration)</text>

    <text x="522" y="113" font-size="11" font-weight="700" fill="#ef4444">PK</text>
    <text x="550" y="113" font-size="11" font-weight="600" fill="#1e293b">experiment_id</text>
    <text x="680" y="113" font-size="11" fill="#64748b">BIGINT</text>

    <text x="550" y="133" font-size="11" fill="#334155">name, description</text>

    <text x="550" y="153" font-size="11" fill="#334155">experiment_status</text>
    <text x="680" y="153" font-size="11" fill="#64748b">ENUM ('RUNNING', 'CONCLUDED')</text>

    <text x="550" y="173" font-size="11" fill="#334155">start_date, end_date</text>
    <text x="680" y="173" font-size="11" fill="#64748b">TIMESTAMP</text>

    <text x="522" y="197" font-size="11" font-weight="700" fill="#059669">FK</text>
    <text x="550" y="197" font-size="11" font-weight="600" fill="#047857">allocation_id</text>
    <text x="680" y="197" font-size="11" fill="#64748b">BIGINT (links to allocation)</text>
  </g>

  <!-- Table: allocation (in Experiment Domain) -->
  <g filter="url(#shadow)">
    <rect x="510" y="260" width="390" height="115" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="510" y="260" width="390" height="26" rx="6" fill="#0d9488"/>
    <rect x="510" y="276" width="390" height="10" fill="#0d9488"/>
    <text x="522" y="278" font-size="12" font-weight="700" fill="#ffffff">allocation (Traffic Split Strategy)</text>

    <text x="522" y="303" font-size="11" font-weight="700" fill="#ef4444">PK</text>
    <text x="550" y="303" font-size="11" font-weight="600" fill="#1e293b">allocation_id</text>
    <text x="680" y="303" font-size="11" fill="#64748b">BIGINT</text>

    <text x="550" y="325" font-size="11" fill="#334155">name, strategy_type</text>
    <text x="680" y="325" font-size="11" fill="#64748b">('USER_ID', 'DEVICE_ID', ...)</text>

    <text x="550" y="347" font-size="11" font-weight="600" fill="#0f766e">details</text>
    <text x="680" y="347" font-size="11" fill="#047857">JSON (Variant weights: A=50%, B=50%)</text>
  </g>

  <!-- Relationship Connector Lines -->
  <!-- 1. campaign_experiment.campaign_ids -> campaign.campaign_id -->
  <path d="M 120 190 L 120 213" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2. campaign_experiment.experiment_id -> experiment.experiment_id -->
  <path d="M 430 130 L 508 130" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3. campaign.segment_ids -> segment.segment_id -->
  <path d="M 120 390 L 120 413" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 4. experiment.allocation_id -> allocation.allocation_id -->
  <path d="M 700 220 L 700 258" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
