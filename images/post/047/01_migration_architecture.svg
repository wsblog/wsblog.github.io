<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- Producers -->
  <rect x="290" y="20" width="240" height="52" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="44" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="600">Producers</text>
  <text x="410" y="61" font-size="12" fill="#64748b" text-anchor="middle">(Spark jobs, apps)</text>

  <!-- dual write arrows -->
  <line x1="360" y1="72" x2="185" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="72" x2="635" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="94" font-size="12" fill="#475569">write</text>
  <text x="565" y="94" font-size="12" fill="#475569">write</text>

  <!-- HDFS -->
  <rect x="40" y="120" width="280" height="54" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="180" y="153" font-size="16" fill="#334155" text-anchor="middle" font-weight="600">HDFS</text>

  <!-- S3-compatible Object Storage -->
  <rect x="500" y="120" width="280" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="153" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="600">S3-compatible Object Storage</text>

  <!-- read arrows down into seam -->
  <line x1="180" y1="174" x2="250" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="174" x2="570" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="202" font-size="12" fill="#475569">read</text>
  <text x="615" y="202" font-size="12" fill="#475569">read</text>

  <!-- One read interface -->
  <rect x="230" y="220" width="360" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="244" font-size="16" fill="#78350f" text-anchor="middle" font-weight="600">One read interface</text>
  <text x="410" y="262" font-size="12" fill="#92400e" text-anchor="middle">Dynamic per-path feature flag</text>
  <text x="410" y="276" font-size="12" fill="#92400e" text-anchor="middle">enable instant rollback</text>

  <!-- diff comparator -->
  <rect x="660" y="222" width="130" height="60" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="725" y="244" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="600">Diff</text>
  <text x="725" y="261" font-size="11" fill="#7c2d12" text-anchor="middle">match / mismatch</text>
  <text x="725" y="275" font-size="11" fill="#7c2d12" text-anchor="middle">to metric</text>
  <line x1="590" y1="252" x2="655" y2="252" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="596" y="245" font-size="11" fill="#c2410c">shadow-read</text>

  <!-- Backend service -->
  <line x1="410" y1="284" x2="410" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="350" width="240" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="377" font-size="15" fill="#14532d" text-anchor="middle" font-weight="600">Backend service</text>
</svg>
