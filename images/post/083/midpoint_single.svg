<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowUp2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 5 L 0 10 L 0 0 z" fill="#c2410c"/>
    </marker>
  </defs>

  <text x="10" y="17" font-size="14" fill="#64748b">Spark planned 40 equal byte ranges</text>

  <!-- 5 of the 40 splits, drawn across 10..750 -->
  <rect x="10"  y="28" width="148" height="52" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="158" y="28" width="148" height="52" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="306" y="28" width="148" height="52" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="454" y="28" width="148" height="52" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="602" y="28" width="148" height="52" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="84"  y="60" font-size="16" fill="#1e3a8a" text-anchor="middle">task 0</text>
  <text x="232" y="60" font-size="16" fill="#94a3b8" text-anchor="middle">&#8230;</text>
  <text x="380" y="60" font-size="16" fill="#1e3a8a" text-anchor="middle">task x</text>
  <text x="528" y="60" font-size="16" fill="#94a3b8" text-anchor="middle">&#8230;</text>
  <text x="676" y="60" font-size="16" fill="#1e3a8a" text-anchor="middle">task 39</text>

  <!-- the single row group's midpoint is the middle of the file -->
  <line x1="380" y1="152" x2="380" y2="84" stroke="#c2410c" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arrowUp2)"/>
  <text x="388" y="146" font-size="13" fill="#c2410c">midpoint</text>

  <rect x="10" y="152" width="740" height="52" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="184" font-size="17" fill="#78350f" text-anchor="middle">1 row group &#183; all 45.8M rows</text>
</svg>
