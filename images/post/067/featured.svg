<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>

    <!-- Filters -->
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1180" height="450" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top badge -->
  <rect x="30" y="20" width="220" height="26" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="140" y="37" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle" letter-spacing="0.5">REQUEST LIFECYCLE</text>

  <!-- ==================================================================== -->
  <!-- STAGE 1: SLACK MESSAGE                                                -->
  <!-- ==================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="170" width="130" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
    <path d="M 55 260 L 70 260 L 55 278 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  </g>
  <text x="95" y="207" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Slack</text>
  <text x="95" y="228" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">domain question</text>

  <path d="M 160 213 L 193 213" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrGray)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 2: CLASSIFIER                                                   -->
  <!-- ==================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="195" y="185" width="150" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  </g>
  <text x="270" y="230" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Classifier</text>

  <path d="M 270 266 L 270 328" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <g filter="url(#cardShadow)">
    <rect x="195" y="330" width="150" height="45" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.3"/>
  </g>
  <text x="270" y="349" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Ticket +</text>
  <text x="270" y="364" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">page on-call</text>

  <path d="M 345 213 L 378 213" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 3: AGENT = LLM + HARNESS                                        -->
  <!-- ==================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="95" width="290" height="215" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/>
    <rect x="380" y="95" width="290" height="32" rx="10" fill="#eef2ff"/>
    <rect x="380" y="115" width="290" height="12" fill="#eef2ff"/>
  </g>
  <text x="525" y="116" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">Agent (Pydantic AI)</text>

  <rect x="400" y="150" width="250" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="525" y="185" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">LLM</text>

  <text x="525" y="222" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle">+</text>

  <rect x="400" y="232" width="250" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="525" y="267" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">Harness</text>

  <path d="M 670 204 L 683 204" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 4: MCP SERVERS                                                  -->
  <!-- ==================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="685" y="110" width="230" height="190" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="685" y="110" width="230" height="30" rx="10" fill="#f0fdf4"/>
    <rect x="685" y="128" width="230" height="12" fill="#f0fdf4"/>
  </g>
  <text x="800" y="130" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">MCP Servers</text>

  <rect x="705" y="152" width="190" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="800" y="184" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">Structured Tools</text>

  <rect x="705" y="215" width="190" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="800" y="247" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Curated Playbooks</text>

  <path d="M 915 204 L 953 204" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- ==================================================================== -->
  <!-- STAGE 5: ANSWER BACK IN SLACK                                         -->
  <!-- ==================================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="955" y="170" width="195" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <text x="1052" y="207" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Answer</text>
  <rect x="985" y="228" width="135" height="22" rx="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1052" y="243" font-size="9" fill="#334155" text-anchor="middle">Need a human?</text>
</svg>
